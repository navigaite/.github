# Managed by navigaite/.github bootstrap. Do not edit manually —
# changes will be overwritten the next time bootstrap-maintenance.sh runs.
#
# Scope:
# - This bootstrap-managed file ONLY configures the github-actions
#   ecosystem (third-party action bumps).
# - The reusable pipeline lives in `maxbec/pipeline` (rehomed 2026-08-14).
#   The universal pipeline is SHA-pinned by the fleet repin tooling and the
#   maintenance callers use rolling `@v3`, which release-please retargets on
#   every release. Do NOT let Dependabot touch either — that would cause
#   noise PRs on every pipeline patch (or fight the managed SHA pin).
# - Native package ecosystems (npm, pip, docker, etc.) are NOT auto-added
#   here. If a repo has a bespoke `dependabot.yml` (without the "Managed by"
#   header above), the bootstrap script preserves it and skips this file.
#   To get github-actions updates AND e.g. npm in the same repo, drop the
#   sentinel header and maintain `dependabot.yml` by hand.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ['*']
    ignore:
      # Managed pins — never bump. Updates come from retagging / fleet
      # repin tooling in maxbec/pipeline.
      - dependency-name: maxbec/pipeline/*
      # Legacy pipeline home — kept ignored so repos with stale refs don't
      # get noise PRs while the fleet migration completes.
      - dependency-name: navigaite/.github/*
    commit-message:
      prefix: chore
      include: scope
