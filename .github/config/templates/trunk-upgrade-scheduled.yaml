# Managed by navigaite/.github bootstrap. Do not edit manually —
# changes will be overwritten the next time bootstrap-maintenance.sh runs.
#
# The cron minute/hour is staggered per repo to avoid a PR storm across
# all Navigaite repos. Bootstrap script substitutes __CRON__ at install time.
---
name: 🧰 Trunk Upgrade

on:
  schedule:
    - cron: '__CRON__'
  workflow_dispatch: {}

permissions: {}

jobs:
  upgrade:
    # Job-level permissions cap the reusable workflow's job permissions.
    # The called workflow needs contents+pull-requests write to push a
    # branch and open a PR with the upgrade diff.
    permissions:
      contents: write
      pull-requests: write
    uses: maxbec/pipeline/.github/workflows/trunk-upgrade.yaml@v3
    # `secrets: inherit` does NOT forward org-level secrets across the
    # owner boundary (the reusable workflow lives in maxbec/pipeline, not
    # in the navigaite org) — inherited org secrets silently resolve empty.
    # Forward explicitly; a secret absent in this repo/org resolves empty
    # and the reusable workflow falls back to GITHUB_TOKEN.
    secrets:
      WORKFLOW_APP_ID: ${{ secrets.WORKFLOW_APP_ID }}
      WORKFLOW_APP_PRIVATE_KEY: ${{ secrets.WORKFLOW_APP_PRIVATE_KEY }}
