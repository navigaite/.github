---
name: Navigaite Pipeline

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/dev' }}

permissions: {}

jobs:
  # ---------------------------------------------------------------------------
  # Branch guard: PRs targeting dev are always allowed (feature branches land
  # there). PRs targeting main must be one of: a promotion from dev or a
  # bot-authored promote/* staging branch (NAV-46 conflict-free promotion),
  # an automated release-please PR, or an emergency hotfix/* — mirrors the
  # pattern other two-branch repos (e.g. edilio) already run.
  #
  # The `if:` also gates on `base.ref == 'main'` (PRI-630). Every code path in
  # the step below exits 0 immediately when the base is not `main`, so running
  # the job on dev-targeted PRs burned a full billed minute to print
  # "PR targets dev — allowed". Skipping it instead costs zero minutes and
  # satisfies the `Branch Guard` required status check exactly as before —
  # GitHub treats an `if:`-skipped job as passing, which this job already
  # relied on for non-PR events (see run 29674631690, where a skipped
  # Branch Guard merged cleanly). `base.ref` is set by GitHub, not the PR
  # author, so it cannot be spoofed from a fork.
  # ---------------------------------------------------------------------------
  branch-guard:
    name: Branch Guard
    if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      pull-requests: read
    steps:
      - name: Check PR target branch
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          PR_HEAD: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_BASE_REPO: ${{ github.repository }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail

          if [[ "$PR_BASE" != "main" ]]; then
            echo "✅ PR targets $PR_BASE — allowed"
            exit 0
          fi

          if [[ "$PR_HEAD_REPO" != "$PR_BASE_REPO" ]]; then
            echo "::error::❌ Fork PRs cannot target main. Please open a PR to dev instead."
            exit 1
          fi

          if [[ "$PR_HEAD" == "dev" ]]; then
            echo "ℹ️  Promotion PR from dev → main"

            OPEN_RP=$(gh api "repos/$PR_BASE_REPO/pulls" \
              --paginate \
              --jq '[.[] | select(
                .state=="open" and .base.ref=="dev" and
                (.head.ref | startswith("release-please"))
              )] | length')
            if [[ "$OPEN_RP" -gt 0 ]]; then
              echo "::error::❌ There is an open release-please PR on dev. Merge or close it before promoting to main."
              exit 1
            fi

            echo "✅ Promotion allowed — no open release-please PR on dev"
            exit 0
          fi

          if [[ "$PR_HEAD" == promote/* ]]; then
            # Staging branch built by the promote-to-main workflow (NAV-46):
            # main + merge(dev) with release-managed files pre-resolved to main.
            # A raw dev → main PR three-way-conflicts on the changelog/version
            # manifests every release, so the promote/* branch is the ONLY
            # conflict-free promotion path. Trusted only when authored by the
            # pipeline bot — a human-pushed promote/* branch could carry
            # arbitrary content to main, so gate on author exactly like the
            # release-please path below.
            if [[ "$PR_AUTHOR" != "github-actions[bot]" && "$PR_AUTHOR" != "navigaite-workflow-app[bot]" ]]; then
              echo "::error::❌ promote/* branch author is '$PR_AUTHOR', not the pipeline bot. Promotion staging branches must be created by the promote-to-main workflow."
              exit 1
            fi
            echo "ℹ️  Promotion PR from staging branch $PR_HEAD → main"

            OPEN_RP=$(gh api "repos/$PR_BASE_REPO/pulls" \
              --paginate \
              --jq '[.[] | select(
                .state=="open" and .base.ref=="dev" and
                (.head.ref | startswith("release-please"))
              )] | length')
            if [[ "$OPEN_RP" -gt 0 ]]; then
              echo "::error::❌ There is an open release-please PR on dev. Merge or close it before promoting to main."
              exit 1
            fi

            echo "✅ Promotion allowed — staging branch from pipeline bot, no open release-please PR on dev"
            exit 0
          fi

          if [[ "$PR_HEAD" == release-please--* ]]; then
            if [[ "$PR_AUTHOR" == "github-actions[bot]" || "$PR_AUTHOR" == "navigaite-workflow-app[bot]" ]]; then
              echo "✅ Release-please PR from bot — allowed"
              exit 0
            fi
            echo "::error::❌ Branch name matches release-please pattern but author is '$PR_AUTHOR', not a bot."
            exit 1
          fi

          if [[ "$PR_HEAD" == hotfix/* ]]; then
            echo "⚠️  Hotfix PR targeting main — allowed"
            echo "::warning::Remember to cherry-pick this hotfix back to dev after merging."
            exit 0
          fi

          echo "::error::❌ PRs targeting main must come from:"
          echo "::error::  dev or promote/* (promotion), release-please (bot), or hotfix/* (emergency)."
          echo "::error::Please retarget this PR to dev instead."
          exit 1

  # ---------------------------------------------------------------------------
  # Lint — validate all workflow and action definitions with actionlint
  # ---------------------------------------------------------------------------
  lint:
    name: 🧹 Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install actionlint
        shell: bash
        run: |
          set -euo pipefail
          ACTIONLINT_VERSION="1.7.7"
          curl -fsSL -o /tmp/actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          tar xzf /tmp/actionlint.tar.gz -C /tmp
          sudo mv /tmp/actionlint /usr/local/bin/
      - name: Run actionlint
        shell: bash
        run: |
          set -euo pipefail
          # Disable shellcheck integration — existing scripts have many
          # info/style-level SC2086/SC2129 warnings that are not actionable
          actionlint -shellcheck="" -color

  # ---------------------------------------------------------------------------
  # Test — validate composite actions reject invalid inputs and block traversal
  # ---------------------------------------------------------------------------
  test:
    name: 🧪 Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test install-dependencies rejects invalid stack
        id: test-install
        continue-on-error: true
        uses: ./.github/actions/install-dependencies
        with:
          stack: invalid
          package-manager: npm
      - name: Assert install-dependencies failure
        shell: bash
        env:
          OUTCOME: ${{ steps.test-install.outcome }}
        run: |
          set -euo pipefail
          if [[ "$OUTCOME" != "failure" ]]; then
            echo "::error::Expected install-dependencies to fail with invalid input but got: $OUTCOME"
            exit 1
          fi
          echo "✅ install-dependencies correctly rejected invalid input"

      - name: Test run-lint rejects invalid stack
        id: test-lint
        continue-on-error: true
        uses: ./.github/actions/run-lint
        with:
          stack: invalid
      - name: Assert run-lint failure
        shell: bash
        env:
          OUTCOME: ${{ steps.test-lint.outcome }}
        run: |
          set -euo pipefail
          if [[ "$OUTCOME" != "failure" ]]; then
            echo "::error::Expected run-lint to fail with invalid input but got: $OUTCOME"
            exit 1
          fi
          echo "✅ run-lint correctly rejected invalid input"

      - name: Test run-build rejects invalid stack
        id: test-build
        continue-on-error: true
        uses: ./.github/actions/run-build
        with:
          stack: invalid
      - name: Assert run-build failure
        shell: bash
        env:
          OUTCOME: ${{ steps.test-build.outcome }}
        run: |
          set -euo pipefail
          if [[ "$OUTCOME" != "failure" ]]; then
            echo "::error::Expected run-build to fail with invalid input but got: $OUTCOME"
            exit 1
          fi
          echo "✅ run-build correctly rejected invalid input"

      - name: Test run-tests rejects invalid stack
        id: test-tests
        continue-on-error: true
        uses: ./.github/actions/run-tests
        with:
          stack: invalid
      - name: Assert run-tests failure
        shell: bash
        env:
          OUTCOME: ${{ steps.test-tests.outcome }}
        run: |
          set -euo pipefail
          if [[ "$OUTCOME" != "failure" ]]; then
            echo "::error::Expected run-tests to fail with invalid input but got: $OUTCOME"
            exit 1
          fi
          echo "✅ run-tests correctly rejected invalid input"

      - name: Test path traversal is rejected
        id: test-traversal
        continue-on-error: true
        uses: ./.github/actions/run-build
        with:
          stack: nodejs
          working-directory: "../../etc"
      - name: Assert path traversal failure
        shell: bash
        env:
          OUTCOME: ${{ steps.test-traversal.outcome }}
        run: |
          set -euo pipefail
          if [[ "$OUTCOME" != "failure" ]]; then
            echo "::error::Expected path traversal to be rejected"
            exit 1
          fi
          echo "✅ Path traversal correctly rejected"

  # ---------------------------------------------------------------------------
  # Build — no application to build; pass-through to satisfy pipeline stages
  # ---------------------------------------------------------------------------
  build:
    name: 🏗️ Build
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo "✅ No application build — this repo contains only GitHub Actions"

  # ---------------------------------------------------------------------------
  # Check Gate — aggregator for org ruleset required status check
  # ---------------------------------------------------------------------------
  check-gate:
    name: Check Gate
    if: always()
    needs: [lint, test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Evaluate pipeline result
        shell: bash
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          set -euo pipefail
          command -v jq >/dev/null || { echo "::error::jq not available"; exit 1; }
          echo "Job results: $RESULTS"
          # Root-cause fix (NAV-20): a required gate must NEVER pass on a
          # skipped required job. The old logic counted only 'failure' and
          # 'cancelled', so a required check reported as 'skipped' (e.g. Test
          # not run on a synchronize push) slipped through as green. This gate
          # aggregates the required validation jobs (lint, test, build), every
          # one of which must run on every PR, so we assert each is exactly
          # 'success' — anything else (skipped/failure/cancelled) fails the gate.
          NOT_PASSED=$(echo "$RESULTS" | jq -r 'map(select(. != "success")) | length')
          if [[ "$NOT_PASSED" -gt 0 ]]; then
            BAD=$(echo "$RESULTS" | jq -rc 'map(select(. != "success"))')
            echo "::error::Pipeline gate failed — ${NOT_PASSED} required job(s) did not succeed (non-success results: ${BAD})."
            echo "::error::A required check reported as skipped/failure/cancelled cannot satisfy the gate."
            exit 1
          fi
          echo "✅ All required pipeline jobs ran and passed"

  # ---------------------------------------------------------------------------
  # Auto-merge — enable auto-merge for dependabot PRs
  # ---------------------------------------------------------------------------
  auto-merge:
    name: 🤖 Auto-merge
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if ! gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --squash --auto; then
            echo "::warning::Failed to enable auto-merge for PR #$PR_NUMBER; continuing because this is best-effort automation."
          fi
