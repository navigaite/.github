---
name: Release

run-name: "Release | ${{ github.actor }}"

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions: {}

jobs:
  release-please:
    name: 📦 Release Please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release-created: ${{ steps.release.outputs.release_created }}
      release-tag: ${{ steps.release.outputs.tag_name }}
      release-version: ${{ steps.release.outputs.version }}
      release-major: ${{ steps.release.outputs.major }}
      release-minor: ${{ steps.release.outputs.minor }}
      release-patch: ${{ steps.release.outputs.patch }}
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: 🔍 Check for GitHub App secrets
        id: check-app
        shell: bash
        env:
          APP_ID: ${{ secrets.WORKFLOW_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.WORKFLOW_APP_PRIVATE_KEY }}
        run: |
          if [[ -n "$APP_ID" && -n "$APP_PRIVATE_KEY" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            missing=()
            [[ -z "$APP_ID" ]] && missing+=("WORKFLOW_APP_ID")
            [[ -z "$APP_PRIVATE_KEY" ]] && missing+=("WORKFLOW_APP_PRIVATE_KEY")
            echo "::warning::${missing[*]} not set — falling back to GITHUB_TOKEN. Auto-merged PRs won't trigger follow-up workflows."
          fi

      - name: 🔑 Generate GitHub App token
        id: app-token
        if: steps.check-app.outputs.available == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.WORKFLOW_APP_ID }}
          private-key: ${{ secrets.WORKFLOW_APP_PRIVATE_KEY }}

      - name: 📦 Run Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          config-file: .github/release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main

      # NOTE: This workflow cuts the STABLE (main) release. The stable
      # release-please PR and the dev→main promotion are board-only — CI must
      # never auto-enable merge on them (and squash is the wrong method for
      # main, which uses merge commits). Auto-merge of the beta release PR lives
      # in release-dev.yaml, where squash on dev is correct.

  update-major-tag:
    name: 🏷️ Update Major Version Tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    needs: release-please
    if: needs.release-please.outputs.release-created == 'true'
    steps:
      - name: 🔍 Check for GitHub App secrets
        id: check-app
        shell: bash
        env:
          APP_ID: ${{ secrets.WORKFLOW_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.WORKFLOW_APP_PRIVATE_KEY }}
        run: |
          if [[ -n "$APP_ID" && -n "$APP_PRIVATE_KEY" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GitHub App secrets not set — tag updates may fail due to tag protection rules."
          fi

      - name: 🔑 Generate GitHub App token
        id: app-token
        if: steps.check-app.outputs.available == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.WORKFLOW_APP_ID }}
          private-key: ${{ secrets.WORKFLOW_APP_PRIVATE_KEY }}

      - name: 📥 Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}

      - name: 🏷️ Update rolling tags
        shell: bash
        env:
          MAJOR: ${{ needs.release-please.outputs.release-major }}
          TAG: ${{ needs.release-please.outputs.release-tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          for ROLLING_TAG in "v${MAJOR}" "latest"; do
            echo "Updating ${ROLLING_TAG} to point to ${TAG}"
            git tag -f "${ROLLING_TAG}" "${TAG}"
            git push --force origin "refs/tags/${ROLLING_TAG}"
            echo "✅ ${ROLLING_TAG} → ${TAG}"
          done

      - name: 📋 Summary
        shell: bash
        env:
          MAJOR: ${{ needs.release-please.outputs.release-major }}
          TAG: ${{ needs.release-please.outputs.release-tag }}
          VERSION: ${{ needs.release-please.outputs.release-version }}
        run: |
          set -euo pipefail
          {
            echo "### 🏷️ Release Published"
            echo ""
            echo "| | |"
            echo "|:---|:---|"
            echo "| **Version** | \`${VERSION}\` |"
            echo "| **Tag** | \`${TAG}\` |"
            echo "| **Major Tag** | \`v${MAJOR}\` → \`${TAG}\` |"
            echo "| **Latest Tag** | \`latest\` → \`${TAG}\` |"
            echo ""
            echo "Consumers using \`@v${MAJOR}\` or \`@latest\` will now get \`${TAG}\`."
          } >> "$GITHUB_STEP_SUMMARY"
