name: Flama Policy

on:
  pull_request:
    branches: [dev]

permissions:
  checks: read
  contents: read

jobs:
  policy:
    uses: maxbec/flama-delivery-platform/.github/workflows/reusable-policy.yml@1e3a00aaace716e8d5f6ea475985857f98377f26
    with:
      base-sha: ${{ github.event.pull_request.base.sha }}
      head-sha: ${{ github.event.pull_request.head.sha }}
      paperclip-app-slug: flama-delivery-navigaite
      platform-sha: 1e3a00aaace716e8d5f6ea475985857f98377f26
      profile: major
