name: Flama Branch Guard

on:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  branch-guard:
    uses: maxbec/flama-delivery-platform/.github/workflows/reusable-branch-guard.yml@1e3a00aaace716e8d5f6ea475985857f98377f26
    with:
      head-sha: ${{ github.event.pull_request.head.sha }}
      profile: major
