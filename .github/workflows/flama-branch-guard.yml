name: Flama Branch Guard

on:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  branch-guard:
    uses: maxbec/flama-delivery-platform/.github/workflows/reusable-branch-guard.yml@8b4fca4b84b7d90de424b3ff58d4fb20195edd10
    with:
      head-sha: ${{ github.event.pull_request.head.sha }}
      profile: major
