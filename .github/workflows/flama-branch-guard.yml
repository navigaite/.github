name: Flama Branch Guard

on:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  branch-guard:
    uses: maxbec/flama-delivery-platform/.github/workflows/reusable-branch-guard.yml@330544867f40c1116222ef2769db9da8a8d627cd
    with:
      head-sha: ${{ github.event.pull_request.head.sha }}
      profile: major
