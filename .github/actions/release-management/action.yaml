---
name: Release Management
description: Automated versioning and changelog generation using release-please or semantic-release

inputs:
  github-token:
    description: GitHub token with contents write and pull-requests write permissions
    required: true

  npm-token:
    description: >-
      npm registry auth token, consumed by @semantic-release/npm to publish
      packages. Leave empty for repos that do not publish to npm.
    required: false
    default: ''

  strategy:
    description: Release strategy (release-please or semantic-release)
    required: false
    default: release-please

  release-type:
    description: Release type (node, python, simple)
    required: false
    default: simple

  package-name:
    description: 'Deprecated: use config-file instead. Package name for release'
    required: false
    default: ''

  bump-minor-pre-major:
    description: 'Deprecated: use config-file instead. Bump minor version before major release'
    required: false
    default: 'true'

  bump-patch-for-minor-pre-major:
    description: 'Deprecated: use config-file instead. Bump patch version for minor pre-major'
    required: false
    default: 'false'

  changelog-types:
    description: 'Deprecated: use config-file instead. Custom changelog types as JSON'
    required: false
    default: ''

  force-patch-on-no-release:
    description: For semantic-release, create a patch release when no releasable commits are found
    required: false
    default: 'false'

  extra-plugins:
    description: Extra semantic-release plugins to install (multiline, one per line)
    required: false
    default: ''

  config-file:
    description: Path to release-please config file (for monorepo manifest mode)
    required: false
    default: ''

  manifest-file:
    description: Path to release-please manifest file (for monorepo manifest mode)
    required: false
    default: ''

  target-branch:
    description: Target branch for release-please
    required: false
    default: ''

  prerelease:
    description: Whether this is a prerelease branch
    required: false
    default: 'false'

  prerelease-type:
    description: Prerelease type label (e.g., beta, alpha, rc)
    required: false
    default: ''

  draft-pull-request:
    description: >-
      Open release-please PRs in draft mode. Defaults to 'true' so the
      caller's full pipeline (test/build/deploy) does not run on every
      merge to the release branch — the release PR only triggers the
      full pipeline when a human marks it "ready for review", at which
      point release-please has already aggregated all changes since the
      last release. Set to 'false' for legacy behavior. Only applies to
      the release-please strategy.
    required: false
    default: 'true'

outputs:
  release-created:
    description: Whether a release was created
    value: ${{ steps.normalize.outputs.release-created }}

  release-id:
    description: Release ID
    value: ${{ steps.normalize.outputs.release-id }}

  release-name:
    description: Release name
    value: ${{ steps.normalize.outputs.release-name }}

  release-tag:
    description: Release tag
    value: ${{ steps.normalize.outputs.release-tag }}

  release-version:
    description: Release version (without 'v' prefix)
    value: ${{ steps.normalize.outputs.release-version }}

  release-major:
    description: Major version
    value: ${{ steps.normalize.outputs.release-major }}

  release-minor:
    description: Minor version
    value: ${{ steps.normalize.outputs.release-minor }}

  release-patch:
    description: Patch version
    value: ${{ steps.normalize.outputs.release-patch }}

  release-sha:
    description: Release commit SHA
    value: ${{ steps.normalize.outputs.release-sha }}

  release-upload-url:
    description: Upload URL for release assets
    value: ${{ steps.normalize.outputs.release-upload-url }}

  pr-number:
    description: Release PR number (if PR was opened/updated)
    value: ${{ steps.normalize.outputs.pr-number }}

runs:
  using: composite
  steps:
    # Prerelease settings CANNOT be injected at runtime. release-please-action
    # calls Manifest.fromManifest(github, targetBranch, configFile, ...), which
    # fetches the config file over the GitHub API from the tip of the target
    # branch — it never reads the runner's checked-out copy. A previous version
    # of this step rewrote the local file with jq; the edit was silently
    # discarded and every prerelease branch kept cutting stable versions
    # (PRI-662). The keys must therefore be COMMITTED to the config file that
    # release.config_file points at.
    #
    # This step verifies that, against the same source release-please reads, and
    # fails loudly when the keys are missing. Silent stable releases on a beta
    # branch are far more expensive than a red pipeline.
    - name: Verify prerelease config
      id: verify-prerelease
      if: inputs.strategy == 'release-please' && inputs.config-file != '' && inputs.prerelease == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        API_URL: ${{ github.api_url }}
        REPO: ${{ github.repository }}
        CONFIG_FILE: ${{ inputs.config-file }}
        TARGET_BRANCH: ${{ inputs.target-branch || github.ref_name }}
        PRERELEASE_TYPE: ${{ inputs.prerelease-type }}
      run: |
        set -euo pipefail

        # curl, not `gh` — the self-hosted runners do not ship the gh CLI.
        echo "Reading $CONFIG_FILE from $REPO@$TARGET_BRANCH (the source release-please itself reads)"
        if ! config=$(curl -sSfL \
          -H "Authorization: Bearer $GH_TOKEN" \
          -H "Accept: application/vnd.github.raw+json" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          "$API_URL/repos/$REPO/contents/$CONFIG_FILE?ref=$TARGET_BRANCH"); then
          echo "::error::Could not read $CONFIG_FILE from $REPO@$TARGET_BRANCH. Does release.config_file point at a file committed on that branch?"
          exit 1
        fi

        if ! echo "$config" | jq empty 2>/dev/null; then
          echo "::error::$CONFIG_FILE on $TARGET_BRANCH is not valid JSON."
          exit 1
        fi

        # Root-level keys act as defaults for every package entry
        # (manifest.ts: `pathConfig.versioning ?? defaultConfig.versioning`),
        # so a key set at either level counts as present.
        read_key() {
          echo "$config" | jq -r --arg k "$1" \
            '[.[$k]] + [(.packages // {} | to_entries[] | .value[$k])]
             | map(select(. != null)) | first // "«unset»"'
        }

        versioning=$(read_key versioning)
        prerelease=$(read_key prerelease)
        ptype=$(read_key prerelease-type)

        echo "  versioning      = $versioning"
        echo "  prerelease      = $prerelease"
        echo "  prerelease-type = $ptype"

        errors=0

        # The release-please config key is `versioning`. `versioning-strategy`
        # is NOT a recognised key — release-please ignores it without warning
        # and falls back to the `default` strategy, producing stable versions.
        if echo "$config" | grep -q '"versioning-strategy"'; then
          echo "::error::$CONFIG_FILE uses \"versioning-strategy\", which release-please does not recognise. Rename it to \"versioning\"."
          errors=1
        fi

        if [[ "$versioning" != "prerelease" ]]; then
          echo "::error::$CONFIG_FILE must set \"versioning\": \"prerelease\" (found: $versioning)."
          errors=1
        fi

        # PrereleaseVersioningStrategy.determineReleaseType() strips the
        # prerelease suffix unless `prerelease` is exactly true, so the
        # versioning strategy alone still yields a stable version.
        if [[ "$prerelease" != "true" ]]; then
          echo "::error::$CONFIG_FILE must set \"prerelease\": true (found: $prerelease)."
          errors=1
        fi

        if [[ -n "$PRERELEASE_TYPE" && "$ptype" != "$PRERELEASE_TYPE" ]]; then
          echo "::error::$CONFIG_FILE must set \"prerelease-type\": \"$PRERELEASE_TYPE\" to match the pipeline.yaml prerelease_branches label (found: $ptype)."
          errors=1
        fi

        if [[ "$errors" -ne 0 ]]; then
          echo ""
          echo "Branch '$TARGET_BRANCH' is configured as a prerelease branch, but"
          echo "$CONFIG_FILE on that branch would make release-please cut a STABLE"
          echo "version. Commit these keys to $CONFIG_FILE (root level is fine):"
          echo ""
          echo "  \"versioning\": \"prerelease\","
          echo "  \"prerelease\": true,"
          echo "  \"prerelease-type\": \"${PRERELEASE_TYPE:-beta}\""
          echo ""
          echo "Keep them OUT of the stable config (release.config_file_stable),"
          echo "or main will cut prereleases too."
          exit 1
        fi

        echo "✓ Prerelease config verified — release-please will cut ${PRERELEASE_TYPE:-prerelease} versions."

    - name: Run Release Please (manifest mode)
      id: release-please-manifest
      if: inputs.strategy == 'release-please' && inputs.config-file != ''
      uses: googleapis/release-please-action@16a9c90856f42705d54a6fda1823352bdc62cf38 # v4.4.0
      with:
        token: ${{ inputs.github-token }}
        config-file: ${{ inputs.config-file }}
        manifest-file: ${{ inputs.manifest-file || '.release-please-manifest.json' }}
        target-branch: ${{ inputs.target-branch || github.ref_name }}

    - name: Run Release Please (legacy mode)
      id: release-please
      if: inputs.strategy == 'release-please' && inputs.config-file == ''
      uses: googleapis/release-please-action@16a9c90856f42705d54a6fda1823352bdc62cf38 # v4.4.0
      with:
        token: ${{ inputs.github-token }}
        release-type: ${{ inputs.release-type }}
        target-branch: ${{ inputs.target-branch || github.ref_name }}

    - name: Run Semantic Release
      id: semantic-release
      if: inputs.strategy == 'semantic-release'
      uses: cycjimmy/semantic-release-action@16ca923e6ccbb50770c415a0ccd43709a8c5f7a4 # v4.2.2
      with:
        semantic_version: 24
        extra_plugins: ${{ inputs.extra-plugins }}
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        # @semantic-release/npm reads NPM_TOKEN from the environment and writes
        # the registry .npmrc itself. Without this, verifyConditions fails with
        # "No npm token specified" for any repo whose .releaserc enables the npm
        # plugin (the pipeline previously plumbed no npm auth at all — NAV-41).
        NPM_TOKEN: ${{ inputs.npm-token }}

    - name: Fallback Patch Release (Semantic Release No-Op)
      id: fallback-release
      if:
        inputs.strategy == 'semantic-release' && inputs.force-patch-on-no-release == 'true' &&
        steps.semantic-release.outputs.new_release_published != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ github.repository }}
        TARGET_SHA: ${{ github.sha }}
      run: |
        set -euo pipefail

        git fetch --tags --force

        latest_tag=$(git tag -l 'v*' --sort=-v:refname | head -n 1)
        if [[ -z "$latest_tag" ]]; then
          latest_tag="v0.0.0"
        fi

        latest_version="${latest_tag#v}"
        IFS='.' read -r major minor patch <<< "$latest_version"
        major="${major:-0}"
        minor="${minor:-0}"
        patch="${patch:-0}"
        next_patch=$((patch + 1))
        next_tag="v${major}.${minor}.${next_patch}"

        if gh release view "$next_tag" --repo "$REPO" >/dev/null 2>&1; then
          echo "created=false" >> "$GITHUB_OUTPUT"
          echo "tag=$next_tag" >> "$GITHUB_OUTPUT"
          echo "version=${next_tag#v}" >> "$GITHUB_OUTPUT"
          echo "url=https://github.com/$REPO/releases/tag/$next_tag" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        gh release create "$next_tag" \
          --repo "$REPO" \
          --target "$TARGET_SHA" \
          --generate-notes \
          --latest \
          --title "$next_tag"

        echo "created=true" >> "$GITHUB_OUTPUT"
        echo "tag=$next_tag" >> "$GITHUB_OUTPUT"
        echo "version=${next_tag#v}" >> "$GITHUB_OUTPUT"
        echo "url=https://github.com/$REPO/releases/tag/$next_tag" >> "$GITHUB_OUTPUT"

    - name: Normalize Release Outputs
      id: normalize
      shell: bash
      env:
        STRATEGY: ${{ inputs.strategy }}
        REPO: ${{ github.repository }}
        RP_RELEASE_CREATED: ${{ steps.release-please.outputs.release_created }}
        RP_TAG_NAME: ${{ steps.release-please.outputs.tag_name }}
        RP_RELEASE_ID: ${{ steps.release-please.outputs.id }}
        RP_RELEASE_NAME: ${{ steps.release-please.outputs.name }}
        RP_RELEASE_SHA: ${{ steps.release-please.outputs.sha }}
        RP_UPLOAD_URL: ${{ steps.release-please.outputs.upload_url }}
        RP_PR: ${{ steps.release-please.outputs.pr }}
        RP_MAJOR: ${{ steps.release-please.outputs.major }}
        RP_MINOR: ${{ steps.release-please.outputs.minor }}
        RP_PATCH: ${{ steps.release-please.outputs.patch }}
        RPM_RELEASE_CREATED: ${{ steps.release-please-manifest.outputs.releases_created }}
        RPM_TAG_NAME: ${{ steps.release-please-manifest.outputs.tag_name }}
        RPM_RELEASE_ID: ${{ steps.release-please-manifest.outputs.id }}
        RPM_RELEASE_NAME: ${{ steps.release-please-manifest.outputs.name }}
        RPM_RELEASE_SHA: ${{ steps.release-please-manifest.outputs.sha }}
        RPM_UPLOAD_URL: ${{ steps.release-please-manifest.outputs.upload_url }}
        RPM_PR: ${{ steps.release-please-manifest.outputs.pr }}
        RPM_MAJOR: ${{ steps.release-please-manifest.outputs.major }}
        RPM_MINOR: ${{ steps.release-please-manifest.outputs.minor }}
        RPM_PATCH: ${{ steps.release-please-manifest.outputs.patch }}
        SR_PUBLISHED: ${{ steps.semantic-release.outputs.new_release_published }}
        SR_VERSION: ${{ steps.semantic-release.outputs.new_release_version }}
        SR_TAG: ${{ steps.semantic-release.outputs.new_release_git_tag }}
        FB_CREATED: ${{ steps.fallback-release.outputs.created }}
        FB_TAG: ${{ steps.fallback-release.outputs.tag }}
        FB_VERSION: ${{ steps.fallback-release.outputs.version }}
        FB_URL: ${{ steps.fallback-release.outputs.url }}
      run: |
        set -euo pipefail
        release_created="false"
        release_id=""
        release_name=""
        release_tag=""
        release_version=""
        release_major=""
        release_minor=""
        release_patch=""
        release_sha=""
        release_upload_url=""
        pr_number=""

        # Use manifest mode outputs if available, fall back to legacy
        if [[ -z "$RP_RELEASE_CREATED" && -n "$RPM_RELEASE_CREATED" ]]; then
          RP_RELEASE_CREATED="$RPM_RELEASE_CREATED"
          RP_TAG_NAME="$RPM_TAG_NAME"
          RP_RELEASE_ID="$RPM_RELEASE_ID"
          RP_RELEASE_NAME="$RPM_RELEASE_NAME"
          RP_RELEASE_SHA="$RPM_RELEASE_SHA"
          RP_UPLOAD_URL="$RPM_UPLOAD_URL"
          RP_PR="$RPM_PR"
          RP_MAJOR="$RPM_MAJOR"
          RP_MINOR="$RPM_MINOR"
          RP_PATCH="$RPM_PATCH"
        fi

        if [[ "$STRATEGY" == "semantic-release" ]]; then
          if [[ "$SR_PUBLISHED" == "true" ]]; then
            release_created="true"
            release_tag="$SR_TAG"
            release_version="$SR_VERSION"
            release_sha="${GITHUB_SHA}"
            if [[ -n "$release_tag" ]]; then
              release_name="$release_tag"
              release_upload_url="https://github.com/$REPO/releases/tag/$release_tag"
            fi
          elif [[ "$FB_CREATED" == "true" ]]; then
            release_created="true"
            release_tag="$FB_TAG"
            release_version="$FB_VERSION"
            release_sha="${GITHUB_SHA}"
            release_name="$FB_TAG"
            release_upload_url="$FB_URL"
          fi
        else
          [[ "$RP_RELEASE_CREATED" == "true" ]] && release_created="true"
          release_id="$RP_RELEASE_ID"
          release_name="$RP_RELEASE_NAME"
          release_tag="$RP_TAG_NAME"
          release_sha="$RP_RELEASE_SHA"
          release_upload_url="$RP_UPLOAD_URL"
          release_major="$RP_MAJOR"
          release_minor="$RP_MINOR"
          release_patch="$RP_PATCH"
          # Extract semver from tag, handling both v1.2.3 and component-v1.2.3 formats
          if [[ "$release_tag" =~ (^|-)v?([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$ ]]; then
            release_version="${BASH_REMATCH[2]}"
          elif [[ -n "$release_major" && -n "$release_minor" && -n "$release_patch" ]]; then
            release_version="${release_major}.${release_minor}.${release_patch}"
          elif [[ -n "$release_tag" ]]; then
            release_version="${release_tag#v}"
          fi

          # release-please can return PR output as JSON; extract number cleanly.
          if [[ "$RP_PR" =~ ^\{ ]]; then
            pr_number=$(echo "$RP_PR" | jq -r '.number // empty' 2>/dev/null || true)
          elif [[ "$RP_PR" =~ ^[0-9]+$ ]]; then
            pr_number="$RP_PR"
          fi
        fi

        {
          echo "release-created=$release_created"
          echo "release-id=$release_id"
          echo "release-name=$release_name"
          echo "release-tag=$release_tag"
          echo "release-version=$release_version"
          echo "release-major=$release_major"
          echo "release-minor=$release_minor"
          echo "release-patch=$release_patch"
          echo "release-sha=$release_sha"
          echo "release-upload-url=$release_upload_url"
          echo "pr-number=$pr_number"
        } >> "$GITHUB_OUTPUT"

    - name: Release Summary
      if: always()
      shell: bash
      env:
        STRATEGY: ${{ inputs.strategy }}
        RELEASE_CREATED: ${{ steps.normalize.outputs.release-created }}
        TAG_NAME: ${{ steps.normalize.outputs.release-tag }}
        RELEASE_ID: ${{ steps.normalize.outputs.release-id }}
        RELEASE_SHA: ${{ steps.normalize.outputs.release-sha }}
        PR_NUMBER: ${{ steps.normalize.outputs.pr-number }}
        REPO: ${{ github.repository }}
        RELEASE_TYPE: ${{ inputs.release-type }}
      run: |
        set -euo pipefail
        if [[ "$RELEASE_CREATED" == "true" ]]; then
          RELEASE_URL="https://github.com/$REPO/releases/tag/$TAG_NAME"
          {
            echo "### 📦 Release"
            echo ""
            echo "| | |"
            echo "|:---|:---|"
            echo "| **Status** | ✅ Created |"
            echo "| **Version** | \`$TAG_NAME\` |"
            echo "| **Release ID** | \`$RELEASE_ID\` |"
            echo "| **SHA** | \`${RELEASE_SHA:0:7}\` |"
            echo "| **Strategy** | \`$STRATEGY\` |"
            echo "| **Release Type** | \`$RELEASE_TYPE\` |"
            echo ""
            echo "[View Release →]($RELEASE_URL)"
          } >> "$GITHUB_STEP_SUMMARY"
        elif [[ -n "$PR_NUMBER" ]]; then
          PR_URL="https://github.com/$REPO/pull/$PR_NUMBER"
          {
            echo "### 📦 Release"
            echo ""
            echo "| | |"
            echo "|:---|:---|"
            echo "| **Status** | 📝 PR Updated |"
            echo "| **PR** | [#$PR_NUMBER]($PR_URL) |"
            echo "| **Strategy** | \`$STRATEGY\` |"
            echo "| **Release Type** | \`$RELEASE_TYPE\` |"
          } >> "$GITHUB_STEP_SUMMARY"
        else
          {
            echo "### 📦 Release"
            echo ""
            echo "| | |"
            echo "|:---|:---|"
            echo "| **Status** | ℹ️ No release |"
            echo "| **Strategy** | \`$STRATEGY\` |"
            echo "| **Release Type** | \`$RELEASE_TYPE\` |"
            echo ""
            echo "_No release was created — no releasable commits since last release"
            if [[ "$STRATEGY" == "release-please" ]]; then
              echo "or release PR is still open._"
            else
              echo "._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
        fi
