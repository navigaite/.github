---
name: Security Scan
description: Comprehensive security scanning including secrets detection and dependency vulnerabilities

inputs:
  enable-trufflehog:
    description: Enable TruffleHog secret scanning
    required: false
    default: 'true'

  enable-dependency-review:
    description: Enable dependency vulnerability scanning (PR only)
    required: false
    default: 'true'

  dependency-review-ghas:
    description: >-
      Set 'true' only for private repos with GitHub Advanced Security
      licensed (Enterprise). The dependency-review-action hard-errors on
      private repos without it, so by default we skip with a warning
      instead of running it there. Public repos always run it regardless
      of this flag.
    required: false
    default: 'false'

  trufflehog-extra-args:
    description: Extra arguments for TruffleHog
    required: false
    default: --only-verified

  fail-on-secrets:
    description: Fail the workflow if secrets are found
    required: false
    default: 'true'

  fail-on-vulnerabilities:
    description: Fail the workflow if vulnerabilities are found
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    # TruffleHog runs Docker-less: the pinned CLI binary is installed and
    # invoked directly instead of the `trufflesecurity/trufflehog` container
    # action. The org-level self-hosted homelab runner (NAV-27 scope-2) is
    # rootless with NO Docker socket, so the container action fails there with
    # "Cannot connect to the Docker daemon" (NAV-39/NAV-33). The binary path
    # keeps identical diff-scan semantics on both GitHub-hosted and self-hosted
    # runners. Version is pinned; the installer is fetched from the matching
    # release tag (not `main`) so the supply chain stays pinned.
    - name: TruffleHog Secret Scanning
      id: trufflehog-scan
      if: inputs.enable-trufflehog == 'true'
      shell: bash
      env:
        TRUFFLEHOG_VERSION: v3.93.4
        EVENT_NAME: ${{ github.event_name }}
        PUSH_BEFORE: ${{ github.event.before }}
        COMMIT_SHA: ${{ github.sha }}
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        EXTRA_ARGS: ${{ inputs.trufflehog-extra-args }}
        FAIL_ON_SECRETS: ${{ inputs.fail-on-secrets }}
      run: |
        set -euo pipefail
        ZERO_SHA=0000000000000000000000000000000000000000

        # Install the pinned TruffleHog binary into a runner-writable dir
        # (works on rootless runners where /usr/local/bin is not writable).
        BIN_DIR="${RUNNER_TEMP}/trufflehog-bin"
        mkdir -p "$BIN_DIR"
        curl -sSfL "https://raw.githubusercontent.com/trufflesecurity/trufflehog/${TRUFFLEHOG_VERSION}/scripts/install.sh" \
          | sh -s -- -b "$BIN_DIR" "${TRUFFLEHOG_VERSION}"
        "$BIN_DIR/trufflehog" --version

        # Build the scan range, mirroring the container action's base/head
        # inputs and its initial-push (no diff base) fallback.
        ARGS=(git "file://${GITHUB_WORKSPACE}" --no-update --fail)
        if [[ "$EVENT_NAME" == "pull_request" ]]; then
          ARGS+=(--since-commit "$PR_BASE_SHA" --branch "$PR_HEAD_SHA")
        elif [[ "$EVENT_NAME" == "push" && ( "$PUSH_BEFORE" == "$COMMIT_SHA" || "$PUSH_BEFORE" == "$ZERO_SHA" ) ]]; then
          ARGS+=(--since-commit "HEAD~10")
        else
          ARGS+=(--since-commit "$PUSH_BEFORE" --branch "$COMMIT_SHA")
        fi
        # Caller-supplied extra args (default: --only-verified). Word-split intentional.
        # shellcheck disable=SC2206
        ARGS+=($EXTRA_ARGS)

        echo "::group::🔍 TruffleHog Secret Scan (${EVENT_NAME})"
        set +e
        "$BIN_DIR/trufflehog" "${ARGS[@]}"
        SCAN_CODE=$?
        set -e
        echo "::endgroup::"

        # `--fail` makes TruffleHog exit 183 when results are found; 0 = clean.
        # Any other non-zero is a real scan error → fail closed regardless of
        # the fail-on-secrets toggle.
        if [[ "$SCAN_CODE" -eq 0 ]]; then
          echo "✅ No secrets detected"
          exit 0
        elif [[ "$SCAN_CODE" -eq 183 ]]; then
          {
            echo "### ⚠️ Security Alert: Secrets Detected"
            echo ""
            echo "TruffleHog detected potential secrets in your code."
            echo "Review the findings above and remove any sensitive data."
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$FAIL_ON_SECRETS" == "true" ]]; then
            echo "::error::TruffleHog detected secrets in the codebase"
            exit 1
          fi
          echo "::warning::TruffleHog detected secrets, but fail-on-secrets is disabled"
          exit 0
        else
          echo "::error::TruffleHog failed to run (exit code ${SCAN_CODE})"
          exit "$SCAN_CODE"
        fi

    - name: Dependency Vulnerability Scan (PR only)
      id: dependency_review
      if: |
        inputs.enable-dependency-review == 'true' &&
        github.event_name == 'pull_request' &&
        (github.event.repository.private == false || inputs.dependency-review-ghas == 'true')
      continue-on-error: true
      uses: actions/dependency-review-action@9129d7d40b8c12c1ed0f60400d00c92d437adcce # v4.1.3
      with:
        fail-on-severity: ${{ inputs.fail-on-vulnerabilities == 'true' && 'moderate' || 'critical' }}
        comment-summary-in-pr: true
        warn-only: ${{ inputs.fail-on-vulnerabilities != 'true' }}

    - name: Dependency Review Unsupported (private repo, no GHAS)
      id: dependency_review_unsupported
      if: |
        inputs.enable-dependency-review == 'true' &&
        github.event_name == 'pull_request' &&
        github.event.repository.private == true &&
        inputs.dependency-review-ghas != 'true'
      shell: bash
      run: |
        set -euo pipefail
        echo "::warning::Dependency review skipped — GitHub Advanced Security is not available on this private repository (team plan needs Enterprise). See PRI-715."

    - name: Check Dependency Review Results
      # dependency_review runs with continue-on-error so the Security Summary
      # always renders. That means a failing review never fails the action on
      # its own — re-check the outcome here and fail explicitly when the caller
      # opted into fail-on-vulnerabilities. Mirrors the TruffleHog gate above.
      if: |
        inputs.enable-dependency-review == 'true' &&
        inputs.fail-on-vulnerabilities == 'true' &&
        github.event_name == 'pull_request' &&
        steps.dependency_review.outcome == 'failure'
      shell: bash
      run: |
        set -euo pipefail
        echo "::error::Dependency review found vulnerabilities at or above the configured severity threshold (fail-on-vulnerabilities is enabled)."
        {
          echo "### ⚠️ Security Alert: Vulnerable Dependencies"
          echo ""
          echo "The dependency review detected vulnerabilities at or above the configured severity threshold."
          echo "Review the dependency-review findings on the PR and update or remove the affected packages."
        } >> "$GITHUB_STEP_SUMMARY"
        exit 1

    - name: Security Summary
      shell: bash
      env:
        ENABLE_TRUFFLEHOG: ${{ inputs.enable-trufflehog }}
        ENABLE_DEP_REVIEW: ${{ inputs.enable-dependency-review }}
        EVENT_NAME: ${{ github.event_name }}
        DEP_REVIEW_OUTCOME: ${{ steps.dependency_review.outcome }}
        DEP_REVIEW_UNSUPPORTED: ${{ steps.dependency_review_unsupported.outcome }}
      run: |
        set -euo pipefail
        TRUFFLEHOG=$([[ "$ENABLE_TRUFFLEHOG" == "true" ]] \
          && echo "✅ Clean" \
          || echo "⏭️ Skipped")
        DEP_CHECK=$([[ "$ENABLE_DEP_REVIEW" == "true" \
          && "$EVENT_NAME" == "pull_request" ]] \
          && echo "true" \
          || echo "false")
        if [[ "$DEP_CHECK" != "true" ]]; then
          DEP_REVIEW="⏭️ Skipped (push event)"
        elif [[ "$DEP_REVIEW_UNSUPPORTED" == "success" ]]; then
          DEP_REVIEW="⚠️ Skipped (no GHAS — team plan)"
        elif [[ "$DEP_REVIEW_OUTCOME" == "success" ]]; then
          DEP_REVIEW="✅ Passed"
        elif [[ "$DEP_REVIEW_OUTCOME" == "failure" ]]; then
          DEP_REVIEW="⚠️ Unsupported or blocked"
        else
          DEP_REVIEW="⏭️ Skipped"
        fi
        {
          echo "### 🔒 Security Scan"
          echo ""
          echo "| Check | Status |"
          echo "|:---|:---|"
          echo "| 🔍 TruffleHog | $TRUFFLEHOG |"
          echo "| 📦 Dependency Review | $DEP_REVIEW |"
        } >> "$GITHUB_STEP_SUMMARY"
